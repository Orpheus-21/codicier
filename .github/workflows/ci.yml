name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    # Arch Linux has Qt 6.8 or later. Ubuntu packages are too old.
    container: archlinux:latest
    steps:
      - name: Install build tools and Qt
        run: >
          pacman -Syu --noconfirm --needed
          gcc make cmake clang git python qt6-base qt6-declarative tomlplusplus hunspell pkgconf

      # The full history lets the floor guard and the coverage check find the base commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The container user does not own the checkout, so git refuses it without this line.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run all checks
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: sh tools/check.sh task "$BASE"

  # The app on macOS: build and the tests of the app. The tooling checks
  # (format, lint, floor guard, coverage) run on Linux.
  macos:
    runs-on: macos-latest
    steps:
      - name: Install build tools
        run: brew install tomlplusplus hunspell pkgconf ninja

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          cache: true

      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -E "^check_|floor_guard|coverage_diff|tst_icons"

  # The app on Windows, with the MinGW packages of MSYS2.
  # MSYS2 ships Qt 6.11, and the app needs Qt 6.12. Until MSYS2 ships
  # Qt 6.12, a failure of this job does not fail the run.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-tomlplusplus
            mingw-w64-ucrt-x86_64-hunspell
            mingw-w64-ucrt-x86_64-python

      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -E "^check_|floor_guard|coverage_diff|tst_icons"

      - name: Show a failed test
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
        run: |
          pacman -Q mingw-w64-ucrt-x86_64-qt6-base
          find build -name 'tst_smoke*' -o -name 'tst_roundtrip*' | head
          cd build/tests
          ./tst_smoke.exe -o -,txt 2>&1 | head -60 || true
          ./tst_roundtrip.exe -o -,txt 2>&1 | head -60 || true

  # The Flatpak: it builds, it starts, and it has no network permission.
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub-beta https://dl.flathub.org/beta-repo/flathub-beta.flatpakrepo
          for remote in flathub flathub-beta; do
            echo "$remote:"; flatpak remote-ls --user --runtime --all "$remote" | grep -E "org.kde.Sdk\s" || true
          done

      - name: Build
        run: >-
          flatpak-builder --user --install-deps-from=flathub --force-clean
          flatpak-build packaging/flatpak/io.github.Orpheus_21.Codicier.yml

      - name: Check
        run: |
          ! grep -n network flatpak-build/metadata
          status=0
          QT_QPA_PLATFORM=offscreen timeout 10 flatpak-builder --run flatpak-build \
            packaging/flatpak/io.github.Orpheus_21.Codicier.yml codicier || status=$?
          test "$status" -eq 124
