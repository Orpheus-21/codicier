# The Flatpak of Codicier. The app gets no network permission.
app-id: io.github.Orpheus_21.Codicier
runtime: org.kde.Platform
# Flathub has the KDE 6.12 runtime only in flathub-beta. Use '6.12' when it
# is in flathub.
runtime-version: '6.12-beta'
sdk: org.kde.Sdk
command: codicier
rename-desktop-file: codicier.desktop
rename-icon: codicier
rename-appdata-file: codicier.metainfo.xml
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # A project folder can be anywhere in the home folder.
  - --filesystem=home
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/pkgconfig
  - '*.a'
  - '*.la'
modules:
  - name: hunspell
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/hunspell/hunspell/releases/download/v1.7.5/hunspell-1.7.5.tar.gz
        sha256: 2e559f0c2a592ba48e421477f58e9bf7e01062277a4a7821afb52fc9401010ae

  # An English dictionary, so that the spelling check works with no host files.
  - name: dictionary-en
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/hunspell en_US.dic en_US.aff
    sources:
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/67032ee957631908098a72edf48dc81cac27e369/en/en_US.dic
        sha256: f0b1a234bd178bdd01875b2a392a9647f888b8fe879f79c52aae62c2759b3647
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/67032ee957631908098a72edf48dc81cac27e369/en/en_US.aff
        sha256: e746c882dd6f303c2c46e7452804b9201115a6942cfeb15f18f8edf774d2e24e

  - name: tomlplusplus
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/marzer/tomlplusplus/archive/refs/tags/v3.4.0.tar.gz
        sha256: 8517f65938a4faae9ccf8ebb36631a38c1cadfb5efa85d9a72e15b9e97d25155

  # Version history runs git.
  - name: git
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS prefix=/app NO_CURL=1 NO_EXPAT=1 NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 install
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz
        sha256: 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3

  - name: codicier
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-cov
          - tasks
